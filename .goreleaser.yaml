version: 2
project_name: 2papi
before:
  hooks:
    - go mod tidy
builds:
  - id: gateway
    main: ./cmd/gateway
    binary: 2papi
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - id: tarball
    builds: [gateway]
    name_template: "2papi_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - src: README.md
        dst: README.md
      - src: config/example.yaml
        dst: config.example.yaml
      - src: open-design/**
        dst: open-design/
      - src: CHANGELOG.md
        dst: CHANGELOG.md
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  draft: false
  prerelease: auto
