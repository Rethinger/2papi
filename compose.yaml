services:
  gateway:
    build: .
    ports: ["18080:8080"]
    depends_on:
      fake-upstream:
        condition: service_healthy
  fake-upstream:
    image: golang:1.22
    working_dir: /src
    volumes: [".:/src"]
    command: go run ./test/fakeupstream
    ports: ["9001:9001", "9002:9002"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9001/v1/chat/completions > /dev/null && curl -fsS http://127.0.0.1:9002/v1/chat/completions > /dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
