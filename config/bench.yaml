# Benchmark config (docker compose --profile bench): one static account on
# the local fake upstream so measurements isolate gateway overhead, not
# provider network time.
version: 1
secret: bench-secret-change-me
server:
  addr: ":8080"
virtual_keys:
  - name: bench
    key: sk-gateway-dev
    models: ["*"]
    rpm: 0
    max_concurrency: 0
accounts:
  - name: fake-primary
    adapter: openai-compatible
    base_url: http://fake-upstream:9001
    api_key: bench-not-used
    enabled: true
models:
  - alias: bench-model
    upstream_model: gpt-bench
    accounts: [fake-primary]
