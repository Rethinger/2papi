version: 1
secret: "bench-secret-replace-with-your-secret"

server:
  addr: "127.0.0.1:8989"

virtual_keys:
  - name: "bench-key"
    key: "sk-2papi-bench"
    models:
      - "claude-opus-5"
      - "claude-opus-5-fast"
      - "claude-opus-5-nosquoze"

models:
  - alias: "claude-opus-5"
    upstream_model: "claude-opus-5"
    accounts:
      - "gorouter"
    optimization:
      squoze: true

  - alias: "claude-opus-5-fast"
    upstream_model: "claude-opus-5"
    thinking_budget: 1024
    accounts:
      - "gorouter"
    optimization:
      squoze: true

  - alias: "claude-opus-5-nosquoze"
    upstream_model: "claude-opus-5"
    accounts:
      - "gorouter"

accounts:
  - name: "gorouter"
    adapter: "openai"
    base_url: "https://gorouter.app/v1"
    api_key: "sk-your-upstream-api-key"
    enabled: true
